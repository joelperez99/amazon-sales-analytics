# Configuración de la interfaz de Streamlit.
#
# El tema es claro de forma explícita porque la paleta de las gráficas está
# validada contra la superficie clara (#fcfcfb): con el tema oscuro los colores
# de serie perderían contraste.

[theme]
base = "light"
primaryColor = "#2a78d6"            # azul de la paleta categórica (serie 1)
backgroundColor = "#f9f9f7"         # plano de la página
secondaryBackgroundColor = "#fcfcfb"  # superficie de tarjetas y barra lateral
textColor = "#0b0b0b"
font = "sans serif"

[server]
maxUploadSize = 200                 # MB; debe coincidir con MAX_FILE_SIZE_MB del .env
# La protección CSRF exige restringir los orígenes permitidos, así que fuerza
# enableCORS=true. No se declara enableCORS aquí para no provocar un conflicto.
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false            # en producción no se exponen trazas al usuario
toolbarMode = "minimal"

[runner]
magicEnabled = true
fastReruns = true

[logger]
level = "info"
