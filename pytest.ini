[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# La raíz del proyecto entra al path para que las pruebas importen
# services, components, database y utils sin instalar el paquete.
pythonpath = .

addopts =
    --strict-markers
    --tb=short
    -ra

# Streamlit y pandas emiten avisos de obsolescencia que no dependen de este
# proyecto; se silencian para que la salida de las pruebas sea legible.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

markers =
    lento: pruebas que tardan más de unos segundos
