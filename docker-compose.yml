# =============================================================================
# Amazon Sales Analytics — despliegue con Docker Compose
#
#   docker compose up -d --build      Levanta la aplicación y PostgreSQL
#   docker compose logs -f app        Sigue los registros
#   docker compose down               Detiene (conserva los datos)
#   docker compose down -v            Detiene y BORRA los volúmenes
#
# Antes de levantar: copia .env.example como .env y ajusta las contraseñas.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: amazon_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amazon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amazon}
      POSTGRES_DB: ${POSTGRES_DB:-amazon_analytics}
      # Ordenamiento y codificación adecuados para textos en español.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # Los scripts de esta carpeta se ejecutan la primera vez que arranca la base.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo se expone en la interfaz local: la base no queda abierta a la red.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amazon} -d ${POSTGRES_DB:-amazon_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - red_amazon

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amazon_analytics_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-amazon}:${POSTGRES_PASSWORD:-amazon}@db:5432/${POSTGRES_DB:-amazon_analytics}
      # El resto de la configuración se toma del archivo .env.
    env_file:
      - .env
    volumes:
      # Los archivos subidos y los registros sobreviven al reinicio del contenedor.
      - datos_cargas:/app/data/uploads
      - registros:/app/logs
    ports:
      - "${APP_PORT:-8501}:8501"
    networks:
      - red_amazon

volumes:
  datos_postgres:
    driver: local
  datos_cargas:
    driver: local
  registros:
    driver: local

networks:
  red_amazon:
    driver: bridge
